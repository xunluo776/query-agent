# Run from the repo root:  docker compose up --build   (stop: docker compose down)
name: query-agent            # project name shown on the Docker dashboard

services:
  mcp-server:
    build:
      context: .                          # repo root: the workspace files live there
      dockerfile: mcp-server/Dockerfile
    image: query-agent-mcp
    container_name: query-agent-mcp
    ports:
      - "8000:8000"                       # Mac port : container port
    volumes:
      - ./data/db:/app/data/db:ro         # data comes in read-only, not baked into the image

  agent:                                  # agent service (FastAPI); chat from the Mac with: uv run agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: query-agent-agent
    container_name: query-agent-agent
    ports:
      - "8001:8001"
    env_file: .env                        # GOOGLE_API_KEY, passed in at runtime (not in the image)
    volumes:
      - ./data/state:/app/data/state      # chat sessions (chats.db) live on the Mac, so a rebuild keeps them
    environment:
      MCP_URL: http://mcp-server:8000/mcp # service name = hostname on Compose's network
    depends_on:
      - mcp-server
    restart: unless-stopped               # retries if it starts before the MCP server is ready

  ui:                                     # chat page: http://localhost:8501
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: query-agent-ui
    container_name: query-agent-ui
    ports:
      - "8501:8501"
    environment:
      AGENT_URL: http://agent:8001        # the agent service, by its Compose name
    depends_on:
      - agent
    restart: unless-stopped
