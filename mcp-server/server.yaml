# MCP server config. Relative paths are relative to this file.

settings:                # apply to the whole server
  db_dir: ../data/db     # folder with the SQLite files (one .db per dataset)
  row_limit: 100000      # safety cap: max rows one query can return (guards against runaway queries)
  timeout_sec: 5         # stop a query that runs longer than this
  allowed_hosts:         # HTTP Host headers the server accepts (DNS rebinding protection); others get 421
    - "127.0.0.1:*"      # the first 3 = the SDK's localhost defaults (Mac, Inspector)
    - "localhost:*"
    - "[::1]:*"
    - "mcp-server:*"     # Compose service name: the agent container calls http://mcp-server:8000/mcp
  allowed_origins:       # browser Origin headers (e.g. the MCP Inspector); others get 403
    - "http://127.0.0.1:*"
    - "http://localhost:*"
    - "http://[::1]:*"

tools:                   # registry: one entry per tool yaml
  - name: videos                               # display name (e.g. agent steps in the UI); same as the file name for now
    path: src/mcp_server/tools/videos.yaml     # tool yaml, relative to this file
    enabled: true
  - name: movies
    path: src/mcp_server/tools/movies.yaml
    enabled: true
  - name: food_delivery
    path: src/mcp_server/tools/food_delivery.yaml
    enabled: true
