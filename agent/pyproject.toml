[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xun", email = "194328036+xunluo776@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.2",
    "langchain[mcp]>=1.4.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
